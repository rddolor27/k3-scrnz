[package]
name = "k3-scrnz"
version = "0.1.0"
description = "Lightweight multi-device Android screen mirror + logcat viewer"
authors = ["rddolor27"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "k3_scrnz_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
bytes = "1"
futures-util = { version = "0.3", features = ["sink"] }
rand = "0.10.3"
regex = "1.13.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sysinfo = { version = "0.40.3", default-features = false, features = ["system"] }
# Pinned to 2.12.x (spec section 2). Must stay on the same minor as @tauri-apps/api and @tauri-apps/cli.
tauri = { version = "~2.12", features = [] }
tauri-plugin-clipboard-manager = "2"
tauri-plugin-log = "2"
thiserror = "2.0.21"
tokio = { version = "1.54", features = ["fs", "net", "io-util", "process", "sync", "time", "macros", "rt-multi-thread"] }
tokio-tungstenite = "0.30"
tokio-util = "0.7"
tracing = { version = "0.1.44", features = ["log"] }

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
