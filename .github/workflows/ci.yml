name: CI

on:
    push:
        branches: [main]
    pull_request:
    workflow_dispatch:

concurrency:
    group: ci-${{ github.ref }}
    cancel-in-progress: true

permissions:
    contents: read

jobs:
    frontend:
        name: Frontend
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: pnpm/action-setup@v4
              with:
                  version: 10
            - uses: actions/setup-node@v4
              with:
                  node-version: 24
                  cache: pnpm
            - run: pnpm install --frozen-lockfile
            - run: pnpm lint
            - run: pnpm format:check
            - run: pnpm build

    rust:
        name: Rust (${{ matrix.os }})
        strategy:
            fail-fast: false
            matrix:
                os: [windows-latest, macos-latest, ubuntu-22.04]
        runs-on: ${{ matrix.os }}
        steps:
            - uses: actions/checkout@v4
            - name: Linux dependencies
              if: runner.os == 'Linux'
              run: |
                  sudo apt-get update
                  sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev
            - uses: pnpm/action-setup@v4
              with:
                  version: 10
            - uses: actions/setup-node@v4
              with:
                  node-version: 24
                  cache: pnpm
            # tauri::generate_context! embeds ../dist, so it must exist to compile.
            - run: pnpm install --frozen-lockfile
            - run: pnpm build
            - uses: dtolnay/rust-toolchain@stable
              with:
                  components: clippy, rustfmt
            - uses: Swatinem/rust-cache@v2
              with:
                  workspaces: src-tauri
            - name: rustfmt
              if: runner.os == 'Linux'
              working-directory: src-tauri
              run: cargo fmt --check
            - name: clippy
              working-directory: src-tauri
              run: cargo clippy --all-targets -- -D warnings
            - name: tests
              working-directory: src-tauri
              run: cargo test
